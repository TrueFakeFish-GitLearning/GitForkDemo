name: Repository Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check README exists
        run: test -f README.md

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest