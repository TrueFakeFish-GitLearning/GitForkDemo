name: Secret Demo

on:
  workflow_dispatch:

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    env:
      APP_ENV: demo

    steps:
      - name: Show normal environment variable
        run: echo "APP_ENV=$APP_ENV"

      - name: Check repository secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN is not available"
            exit 1
          fi

          echo "DEMO_TOKEN is available"